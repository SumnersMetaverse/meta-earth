version: '3.8'

services:
  metaearth-forwarder:
    build:
      context: .
      dockerfile: Dockerfile.forwarder
    ports:
      - "3000:3000"
    environment:
      - ME_CHAIN_ID=${ME_CHAIN_ID:-mechain_100-1}
      - ME_RPC_ENDPOINT=${ME_RPC_ENDPOINT:-http://localhost:26657}
      - ME_FEE_DENOM=${ME_FEE_DENOM:-umec}
      - ME_ADDRESS_PREFIX=${ME_ADDRESS_PREFIX:-me}
      - ME_FORWARD_DEST=${ME_FORWARD_DEST}
      - ME_TX_MEMO=${ME_TX_MEMO}
      - ME_GAS_PRICE=${ME_GAS_PRICE:-0.025}
      - ME_GAS_LIMIT=${ME_GAS_LIMIT:-150000}
      - PORT=3000
    secrets:
      - me_signer_mnemonic
    restart: unless-stopped
    networks:
      - metaearth

networks:
  metaearth:
    driver: bridge

secrets:
  me_signer_mnemonic:
    file: ./secrets/me_signer_mnemonic.txt
